    const jet = new T.Mesh(jg, W.MAT.flat);
    jet.position.set(12.2, 0, 1.1);
    jet.rotation.y = 1.25;
    jet.name = 'jetski';
    W.group.add(jet);
    W.floaters.push({ mesh: jet, x: 12.2, z: 1.1, ry: 1.25, amp: 1.5, span: 1.2, phase: 4.1 });
  }

  /* =========================================================================
     SEAGULLS — one InstancedMesh.  Fliers follow lazy noise-driven loops;
     wingspan scale fakes the flap.  A few are perched on the mole and rail.
     ========================================================================= */
  function buildGulls() {
    const C0 = W.COL, rng = mulberry(4747), m = new Mesher(), c = new T.Color();
    const white = mixc(C0.FOAM, C0.CEMENT, 0.12, new T.Color());
    m.box(white, 0, 0, 0, 0.3, 0.28, 1.0);                       // body, +Z forward
    m.box(white, 0, 0.1, 0.52, 0.22, 0.22, 0.26);                // head
    m.box(mixc(C0.SUN, C0.TERRACOTTA, 0.25, c), 0, 0.08, 0.72, 0.08, 0.08, 0.22);
    m.box(mixc(C0.CEMENT, C0.NIGHT_TOP, 0.35, c), 0, 0.12, -0.42, 0.26, 0.06, 0.4);  // tail
    const A = new T.Vector3(), B = new T.Vector3(), D = new T.Vector3(), E = new T.Vector3();
    for (let s = -1; s <= 1; s += 2) {
      A.set(s * 0.12, 0.08, 0.2); B.set(s * 0.95, 0.2, 0.0);
      D.set(s * 1.05, 0.18, -0.4); E.set(s * 0.12, 0.08, -0.26);
      if (s > 0) m.quad(white, A, B, D, E); else m.quad(white, E, D, B, A);
      A.set(s * 0.95, 0.2, 0.0); B.set(s * 1.42, 0.16, -0.18);
      D.set(s * 1.4, 0.15, -0.46); E.set(s * 1.05, 0.18, -0.4);
      const tip = mixc(C0.CEMENT, C0.NIGHT_TOP, 0.45, c);
      if (s > 0) m.quad(tip, A, B, D, E); else m.quad(tip, E, D, B, A);
    }
    const geo = m.geo();
    const N = 22, xs = [];
    W.gulls = [];
    for (let i = 0; i < N; i++) xs.push(xf(0, -500, 0));   // parked until update()
    const im = instanced(geo, W.MAT.flat, xs, white, 0.07, 'gulls');
    im.frustumCulled = false;
    for (let i = 0; i < N; i++) {
      if (i < W.perches.length) {
        const p = W.perches[i];
        W.gulls.push({ perched: true, x: p.x, y: p.y, z: p.z, ry: p.ry, phase: rng() * TAU });
      } else if (i < W.perches.length + 3) {
        // one on the railing, one on a lamp, one on the dumpster lid
        const spots = [[-52, 2.82, -2.72, 0.2], [28.4, 7.5, -3.7, 2.4], [58, 3.6, -14.5, -1.0]];
        const s = spots[i - W.perches.length];
        W.gulls.push({ perched: true, x: s[0], y: s[1], z: s[2], ry: s[3], phase: rng() * TAU });
      } else {
        W.gulls.push({
          perched: false,
          cx: (rng() - 0.5) * 150, cz: 20 + rng() * 90,
          rx: 14 + rng() * 34, rz: 10 + rng() * 26,
          y: 9 + rng() * 22, sp: (0.07 + rng() * 0.1) * (rng() < 0.5 ? -1 : 1),
          ph: rng() * TAU, flap: 2.2 + rng() * 2.4, drift: rng() * 10
        });
      }
    }
    W.gullMesh = im;
  }

  /* =========================================================================
     CITY BACKDROP (z < -34, decorative).  Stacked flat-roofed blocks in
     bleached ochre and white, red-tiled older houses with the triple-arch
     window motif, balconies, tanks, dishes, a minaret and a bell tower,
     laundry, cranes.  Two merged meshes + one glow mesh.
     ========================================================================= */
  function buildCity() {
    const C0 = W.COL, rng = mulberry(3131), c = new T.Color();
    const m = new Mesher(), mw = new Mesher(), mf = new Mesher();
    const mk = new Mesher();          // the two stone landmarks, in masonry
    const GROUND = 9.4;
    const wallCols = [
      mixc(C0.LIMESTONE, C0.FOAM, 0.45, new T.Color()),
      mixc(C0.LIMESTONE, C0.SUN, 0.14, new T.Color()),
      mixc(C0.FOAM, C0.CEMENT, 0.25, new T.Color()),
      mixc(C0.LIMESTONE, C0.TERRACOTTA, 0.1, new T.Color())
    ];
    const winCol = mixc(C0.SUN, C0.FOAM, 0.2, new T.Color());

    // the plateau the city stands on
    m.box(mixc(C0.LIMESTONE, C0.STONE_DARK, 0.3, c), 0, GROUND - 1.5, -78, 400, 3, 92, 0, 0, 0, 1 / 8);

    const rows = [
      { z: -45, n: 13, h: [9, 17], det: 2 },
      { z: -60, n: 12, h: [12, 23], det: 2 },
      { z: -76, n: 11, h: [14, 27], det: 1 },
      { z: -94, n: 10, h: [16, 30], det: 0 },
      { z: -112, n: 9, h: [18, 34], det: 0 }
    ];
    for (let r = 0; r < rows.length; r++) {
      const row = rows[r];
      for (let i = 0; i < row.n; i++) {
        const x = -165 + (i + rng() * 0.5) * (330 / row.n);
        const z = row.z + (rng() - 0.5) * 7;
        const w = 11 + rng() * 11, d = 10 + rng() * 9;
        const H = row.h[0] + rng() * (row.h[1] - row.h[0]);
        const old = rng() < 0.26;                      // older terracotta house
        const base = wallCols[(rng() * wallCols.length) | 0];
        const floors = Math.max(2, Math.round((old ? H * 0.7 : H) / 3.1));
        let y = GROUND;
        // stacked storeys, each slightly inset / offset — the real skyline
        for (let f = 0; f < floors; f++) {
          const fh = (old ? H * 0.7 : H) / floors;
          const inset = f === 0 ? 0 : rng() * 0.5;
          vary(base, rng, 0.1, c);
          // contact darkening on the lowest storey
          if (f === 0) mixc(c, C0.STONE_DARK, 0.14, c);
          m.box(c, x + (rng() - 0.5) * 0.6, y + fh * 0.5, z, w - inset, fh * 1.02, d - inset,
            0, (rng() - 0.5) * 0.04, 0, 1 / 8);
          // windows on the seaward face
          const cols = Math.max(2, Math.round(w / 3.4));
          for (let q = 0; q < cols; q++) {
            if (rng() < 0.12) continue;
            const wx = x - w * 0.42 + (q + 0.5) * (w * 0.84 / cols);
            mw.box(winCol, wx, y + fh * 0.55, z + d * 0.5 + 0.08, 1.05, 1.5, 0.12);
          }
          // balconies with chunky balusters
          if (row.det >= 1 && f > 0 && rng() < 0.72) {
            const bw = w * (0.4 + rng() * 0.45);
            vary(mixc(base, C0.CEMENT, 0.3, c), rng, 0.08, c);
            m.box(c, x + (rng() - 0.5) * 2, y + 0.18, z + d * 0.5 + 0.7, bw, 0.22, 1.5, 0, 0, 0, 1 / 6);
            const nb = Math.max(3, Math.round(bw / 0.7));
            for (let q = 0; q < nb; q++) {
              mf.box(mixc(C0.FOAM, C0.CEMENT, 0.3, c),
                x + (rng() - 0.5) * 2 - bw * 0.5 + (q + 0.5) * (bw / nb), y + 0.62, z + d * 0.5 + 1.38,
                0.14, 0.66, 0.14);
            }
            mf.box(mixc(C0.RUST, C0.CEMENT, 0.4, c), x, y + 0.98, z + d * 0.5 + 1.38, bw, 0.1, 0.16);
          }
          y += fh;
        }
        if (old) {
          // the classic Lebanese triple-arched central window
          const ty = GROUND + H * 0.7 * 0.55, fz = z + d * 0.5 + 0.1;
          for (let q = -1; q <= 1; q++) {
            const aw = q === 0 ? 1.5 : 1.2, ah = q === 0 ? 3.0 : 2.4;
            mw.box(winCol, x + q * 1.9, ty, fz, aw, ah, 0.14);
            mw.prim(PRIM.cyl8, winCol, x + q * 1.9, ty + ah * 0.5, fz, aw, 0.14, aw,
              Math.PI * 0.5, 0, 0);
            mf.box(mixc(C0.FOAM, C0.LIMESTONE, 0.3, c), x + q * 1.9, ty, fz + 0.06, aw + 0.3, ah, 0.1);
            mf.prim(PRIM.cyl8, mixc(C0.FOAM, C0.LIMESTONE, 0.3, c), x + q * 1.9, ty + ah * 0.5, fz + 0.06,
              aw + 0.3, 0.1, aw + 0.3, Math.PI * 0.5, 0, 0);
          }
          // hipped terracotta roof
          const rh = 2.6 + rng() * 1.6;
          m.prim(PRIM.pyr4, vary(C0.TERRACOTTA, rng, 0.11, c), x, GROUND + H * 0.7 + rh * 0.5, z,
            Math.max(w, d) * 1.08, rh, Math.max(w, d) * 1.08, 0, Math.PI * 0.25, 0, 1 / 4);
        } else {
          // flat roof: parapet, water tanks, dishes, a forest of antennas
          const top = GROUND + H;
          m.box(vary(shade(base, 0.04, c), rng, 0.06, c), x, top + 0.3, z, w + 0.2, 0.6, d + 0.2, 0, 0, 0, 1 / 8);
          m.box(mixc(base, C0.CEMENT, 0.4, c), x, top + 0.05, z, w - 0.6, 0.2, d - 0.6, 0, 0, 0, 1 / 8);
          const nt = 1 + ((rng() * 3) | 0);
          for (let q = 0; q < nt; q++) {
            const tx = x + (rng() - 0.5) * (w - 3), tz = z + (rng() - 0.5) * (d - 3);
            mf.prim(PRIM.cyl8, rng() < 0.6 ? mixc(C0.NIGHT_TOP, C0.DENIM, 0.3, c) : C0.FOAM,
              tx, top + 1.1, tz, 1.5, 1.5, 1.5, 0, rng() * 3, 0);
            mf.box(mixc(C0.CEMENT, C0.RUST, 0.3, c), tx, top + 0.42, tz, 1.7, 0.2, 1.7);
          }
          if (rng() < 0.8) {   // satellite dishes, all pointing the same way
            for (let q = 0; q < 1 + ((rng() * 3) | 0); q++) {
              const dx2 = x + (rng() - 0.5) * (w - 2), dz2 = z + (rng() - 0.5) * (d - 2);
              mf.prim(PRIM.disc, mixc(C0.FOAM, C0.CEMENT, 0.2, c), dx2, top + 1.3, dz2,
                1.5, 1.5, 1.5, -0.9, 0.15, 0);
              mf.rod(C0.CEMENT, dx2, top + 0.6, dz2, dx2, top + 1.3, dz2, 0.08, PRIM.cyl6);
            }
          }
          for (let q = 0; q < 2; q++) {
            mf.rod(mixc(C0.CEMENT, C0.RUST, 0.35, c), x + (rng() - 0.5) * w, top + 0.6, z + (rng() - 0.5) * d,
              x + (rng() - 0.5) * w, top + 2.6 + rng() * 2.5, z + (rng() - 0.5) * d, 0.05, PRIM.cyl6);
          }
          // laundry strung across the roof
          if (row.det >= 1 && rng() < 0.65) {
            const lx1 = x - w * 0.35, lx2 = x + w * 0.35, ly = top + 1.5, lz = z + (rng() - 0.5) * 3;
            mf.rod(C0.CEMENT, lx1, ly, lz, lx2, ly, lz, 0.025, PRIM.cyl6);
            const nl = 4 + ((rng() * 4) | 0);
            for (let q = 0; q < nl; q++) {
              const t = (q + 0.5) / nl;
              const cl = [C0.FOAM, C(TIER_COLS[2]), C0.TERRACOTTA, C0.DENIM, C0.SUN][(rng() * 5) | 0];
              mf.box(vary(cl, rng, 0.18, c), lerp(lx1, lx2, t), ly - 0.55, lz,
                0.75, 1.0, 0.04, 0, 0, (rng() - 0.5) * 0.1);
            }
          }
        }
      }
    }

    /* --- minaret and church bell tower, side by side as they really are ---- */
    const MX = -58, MZ = -56;
    m.box(mixc(C0.LIMESTONE, C0.FOAM, 0.3, c), MX, GROUND + 7, MZ, 7, 14, 7, 0, 0, 0, 1 / 6);
    m.prim(PRIM.cyl8, mixc(C0.LIMESTONE, C0.FOAM, 0.35, c), MX, GROUND + 26, MZ, 4.4, 24, 4.4, 0, 0, 0, 1 / 6);
    m.prim(PRIM.cyl8, mixc(C0.LIMESTONE, C0.CEMENT, 0.2, c), MX, GROUND + 38, MZ, 6.4, 1.0, 6.4, 0, 0, 0, 1 / 6);
    for (let q = 0; q < 8; q++) {
      const a = (q / 8) * TAU;
      mf.box(mixc(C0.FOAM, C0.CEMENT, 0.2, c), MX + Math.cos(a) * 2.8, GROUND + 39.4, MZ + Math.sin(a) * 2.8,
        0.9, 1.6, 0.3, 0, -a, 0);
      mw.box(winCol, MX + Math.cos(a) * 2.1, GROUND + 33, MZ + Math.sin(a) * 2.1, 0.7, 2.2, 0.2, 0, -a, 0);
    }
    m.prim(PRIM.cyl8, mixc(C0.LIMESTONE, C0.FOAM, 0.35, c), MX, GROUND + 44, MZ, 3.6, 8, 3.6, 0, 0, 0, 1 / 6);
    m.prim(PRIM.cone8, mixc(C0.PALM_GREEN, C0.SEA_DEEP, 0.25, c), MX, GROUND + 51, MZ, 4.6, 6, 4.6);
    mf.prim(PRIM.torus, C0.SUN, MX, GROUND + 55.5, MZ, 1.6, 1.6, 1.0, 0, 0, 0.3);
    const CHX = -44, CHZ = -58;
    m.box(mixc(C0.LIMESTONE, C0.FOAM, 0.25, c), CHX, GROUND + 7, CHZ, 16, 14, 11, 0, 0, 0, 1 / 6);
    m.prim(PRIM.pyr4, vary(C0.TERRACOTTA, rng, 0.08, c), CHX, GROUND + 16.5, CHZ, 18, 5, 13, 0, Math.PI * 0.25, 0, 1 / 4);
    m.box(mixc(C0.LIMESTONE, C0.FOAM, 0.3, c), CHX + 9, GROUND + 13, CHZ + 1, 6.5, 26, 6.5, 0, 0, 0, 1 / 6);
    for (let s = 0; s < 4; s++) {
      const a = (s / 4) * TAU + 0.78;
      mf.box(mixc(C0.FOAM, C0.LIMESTONE, 0.2, c), CHX + 9 + Math.cos(a) * 2.6, GROUND + 28, CHZ + 1 + Math.sin(a) * 2.6,
        0.8, 4, 0.8);
    }
    mw.box(winCol, CHX + 9, GROUND + 27.5, CHZ + 1, 3.4, 3.4, 3.4);
    m.prim(PRIM.pyr4, vary(C0.TERRACOTTA, rng, 0.08, c), CHX + 9, GROUND + 32, CHZ + 1, 8, 4.5, 8, 0, Math.PI * 0.25, 0, 1 / 4);
    mf.box(mixc(C0.FOAM, C0.CEMENT, 0.2, c), CHX + 9, GROUND + 36.5, CHZ + 1, 0.3, 3.4, 0.3);
    mf.box(mixc(C0.FOAM, C0.CEMENT, 0.2, c), CHX + 9, GROUND + 36.8, CHZ + 1, 1.6, 0.3, 0.3);
    mw.box(winCol, CHX, GROUND + 9, CHZ + 5.6, 2.4, 5, 0.2);

    /* --- KHAN EL-FRANJ — خان الإفرنج ---------------------------------------
       Fakhreddine's 17th-c. caravanserai: a two-storey rectangle of honey
       limestone wrapped round an arcaded courtyard, under terracotta hips.
       Sits in the old town, low and wide, so it reads as a lid on the souks. */
    (function () {
      const KX = -58, KZ = -52;
      const stone = mixc(C0.LIMESTONE, C0.SUN, 0.1, new T.Color());
      const shade = mixc(C0.STONE_DARK, C0.LIMESTONE, 0.45, new T.Color());
      const dark = mixc(C0.STONE_WET, C0.NIGHT_TOP, 0.35, new T.Color());
      const F1 = 6.4, F2 = 5.8;                     // storey heights
      // four ranges round a 20 x 12 courtyard
      const ranges = [
        { x: KX, z: KZ + 10, w: 36, d: 8, face: 'n' },
        { x: KX, z: KZ - 10, w: 36, d: 8, face: 's' },
        { x: KX - 14, z: KZ, w: 8, d: 12, face: 'e' },
        { x: KX + 14, z: KZ, w: 8, d: 12, face: 'w' }
      ];
      for (let i = 0; i < ranges.length; i++) {
        const R = ranges[i];
        mk.box(vary(stone, rng, 0.07, c), R.x, GROUND + F1 * 0.5, R.z, R.w, F1, R.d, 0, 0, 0, 1 / 6);
        mk.box(vary(stone, rng, 0.07, c), R.x, GROUND + F1 + F2 * 0.5, R.z, R.w - 0.5, F2, R.d - 0.5, 0, 0, 0, 1 / 6);
        // hipped terracotta roof
        mf.prim(PRIM.pyr4, vary(C0.TERRACOTTA, rng, 0.09, c), R.x, GROUND + F1 + F2 + 1.5, R.z,
          R.w + 1.4, 3.0, R.d + 1.4, 0, Math.PI * 0.25, 0, 1 / 4);
        // the arcade: piers with shadowed openings, courtyard side only
        const along = (R.face === 'n' || R.face === 's');
        const span = along ? R.w : R.d;
        const n = Math.max(3, Math.round(span / 3.2));
        const inward = R.face === 'n' ? -1 : R.face === 's' ? 1 : 0;
        const inwardX = R.face === 'e' ? 1 : R.face === 'w' ? -1 : 0;
        for (let q = 0; q < n; q++) {
          const t = (q + 0.5) / n - 0.5;
          const px = along ? R.x + t * span : R.x + inwardX * (R.d * 0.5 - 0.3);
          const pz = along ? R.z + inward * (R.d * 0.5 - 0.3) : R.z + t * span;
          mk.box(shade, px, GROUND + F1 * 0.5, pz, along ? 1.0 : 0.5, F1, along ? 0.5 : 1.0, 0, 0, 0, 1 / 6);
          // the dark of the gallery behind each arch
          if (q < n - 1) {
            const t2 = (q + 1) / n - 0.5;
            const mx = along ? R.x + t2 * span : px;
            const mz = along ? pz : R.z + t2 * span;
            mf.box(dark, mx, GROUND + F1 * 0.62, mz, along ? span / n - 1.0 : 0.3,
              F1 * 0.6, along ? 0.3 : span / n - 1.0);
            mw.box(winCol, mx, GROUND + F1 + F2 * 0.55, mz, along ? span / n - 1.4 : 0.25,
              F2 * 0.45, along ? 0.25 : span / n - 1.4);
          }
        }
      }
      // courtyard floor, fountain, two bitter-orange trees
      mf.box(mixc(C0.LIMESTONE, C0.CEMENT, 0.3, c), KX, GROUND + 0.15, KZ, 21, 0.3, 13, 0, 0, 0, 1 / 5);
      mf.prim(PRIM.cyl12, shade, KX, GROUND + 0.6, KZ, 3.4, 1.2, 3.4);
      mf.prim(PRIM.cyl8, mixc(C0.FOAM, C0.CEMENT, 0.2, c), KX, GROUND + 1.6, KZ, 0.7, 2.0, 0.7);
      for (let q = 0; q < 2; q++) {
        const tx = KX + (q ? 7 : -7), tz = KZ + (q ? 3.5 : -3.5);
        mf.prim(PRIM.cyl6, C0.TRUNK, tx, GROUND + 1.6, tz, 0.5, 3.2, 0.5);
        mf.prim(PRIM.ico, vary(C0.PALM_GREEN, rng, 0.14, c), tx, GROUND + 4.4, tz, 4.4, 3.6, 4.4);
      }
      // the great gate on the seaward face
      mk.box(shade, KX, GROUND + F1 * 0.55, KZ + 14.1, 6.0, F1 * 1.1, 1.2, 0, 0, 0, 1 / 6);
      mf.box(dark, KX, GROUND + F1 * 0.45, KZ + 14.5, 3.6, F1 * 0.8, 0.5);
    })();

    /* --- QALAAT AL-MUIZZ / ST LOUIS CASTLE — قلعة المعز ---------------------
       The land castle: a Crusader ruin on the mound above the old city. Built
       gap-toothed on purpose — half-fallen curtain, one broken drum tower,
       rubble and scrub down the slope. It is a ruin, not a castle. */
    (function () {
      const QX = 54, QZ = -98, BASE = GROUND + 15;
      const stone = mixc(C0.LIMESTONE, C0.STONE_DARK, 0.42, new T.Color());
      // the mound
      m.prim(PRIM.cone8, mixc(C0.PALM_GREEN, C0.STONE_DARK, 0.62, c),
        QX, GROUND + 8.0, QZ, 62, 16.5, 52, 0, 0.4, 0, 1 / 8);
      m.prim(PRIM.cone8, mixc(C0.STONE_DARK, C0.LIMESTONE, 0.35, c),
        QX, GROUND + 12.5, QZ, 34, 8.0, 30, 0, 0.9, 0, 1 / 8);
      // curtain wall, with whole sections simply gone
      const segs = [
        { x: -13, z: -10, w: 26, d: 2.2, h: 9.5, gap: 0.0 },
        { x: 13, z: 0, w: 2.2, d: 20, h: 7.0, gap: 0.35 },
        { x: -13, z: 0, w: 2.2, d: 20, h: 10.5, gap: 0.0 },
        { x: 4, z: 10, w: 16, d: 2.2, h: 5.0, gap: 0.5 }
      ];
      for (let i = 0; i < segs.length; i++) {
        const S2 = segs[i];
        const along = S2.w > S2.d;
        const span = along ? S2.w : S2.d;
        const n = Math.round(span / 2.2);
        for (let q = 0; q < n; q++) {
          if (rng() < S2.gap) continue;                 // collapsed length
          const t = (q + 0.5) / n - 0.5;
          const bx = QX + S2.x + (along ? t * span : 0);
          const bz = QZ + S2.z + (along ? 0 : t * span);
          // the top of a ruin is never level
          const hh = S2.h * (0.55 + rng() * 0.5);
          mk.box(vary(stone, rng, 0.12, c), bx, BASE + hh * 0.5, bz,
            along ? span / n + 0.1 : S2.w, hh, along ? S2.d : span / n + 0.1,
            0, (rng() - 0.5) * 0.03, 0, 1 / 6);
          if (rng() < 0.4) {
            mk.box(vary(stone, rng, 0.14, c), bx + (rng() - 0.5) * 0.6, BASE + hh + 0.5, bz,
              1.3, 1.0, 1.3, 0, rng() * TAU, (rng() - 0.5) * 0.12, 1 / 6);
          }
        }
      }
      // the broken drum tower on the seaward corner
      for (let k = 0; k < 5; k++) {
        const r2 = 9.2 - k * 0.35;
        mk.prim(PRIM.cyl12, vary(stone, rng, 0.1, c), QX - 13, BASE + 1.6 + k * 2.8, QZ - 10,
          r2, 2.8, r2, 0, 0, 0, 1 / 6);
      }
      for (let q = 0; q < 7; q++) {                     // ragged crown
        const a = (q / 7) * TAU + 0.3;
        if (rng() < 0.3) continue;
        mk.box(vary(stone, rng, 0.12, c), QX - 13 + Math.cos(a) * 3.6,
          BASE + 15.5 + rng() * 1.6, QZ - 10 + Math.sin(a) * 3.6,
          2.0, 1.6 + rng() * 2.2, 2.0, 0, a, 0, 1 / 6);
      }
      // rubble and scrub spilling down the slope
      for (let q = 0; q < 26; q++) {
        const a = rng() * TAU, rr = 12 + rng() * 17;
        const sx = QX + Math.cos(a) * rr, sz = QZ + Math.sin(a) * rr * 0.85;
        const sy = GROUND + 15.5 - (rr - 12) * 0.62;
        if (rng() < 0.45) {
          mf.prim(PRIM.ico, vary(mixc(C0.PALM_GREEN, C0.STONE_DARK, 0.4, c), rng, 0.16, c),
            sx, sy, sz, 2.2 + rng() * 2.4, 1.3 + rng(), 2.2 + rng() * 2.4, 0, rng() * TAU, 0);
        } else {
          mk.box(vary(stone, rng, 0.13, c), sx, sy, sz,
            0.9 + rng() * 2.0, 0.7 + rng() * 1.3, 0.9 + rng() * 1.8,
            rng() * 0.4, rng() * TAU, rng() * 0.4, 1 / 6);
        }
      }
    })();

    /* --- construction cranes: the national bird of the skyline ------------- */
    const cranes = [[-104, -70, 40], [22, -84, 52], [128, -62, 34]];
    for (let q = 0; q < cranes.length; q++) {
      const cx = cranes[q][0], cz = cranes[q][1], ch = cranes[q][2];
      const col = mixc(C0.HAZARD, C0.FOAM, 0.1, new T.Color());
      for (let s = 0; s < 4; s++) {
        const sx = (s & 1 ? 1 : -1) * 0.8, sz = (s & 2 ? 1 : -1) * 0.8;
        mf.box(col, cx + sx, GROUND + ch * 0.5, cz + sz, 0.3, ch, 0.3);
      }
      for (let y = 0; y < ch; y += 3.4) {
        mf.box(col, cx, GROUND + y, cz, 1.9, 0.18, 1.9);
      }
      const jy = GROUND + ch, ja = 0.6 + q;
      const jx = Math.cos(ja), jz = Math.sin(ja);
      mf.box(col, cx + jx * 13, jy + 1.6, cz + jz * 13, 26, 0.7, 0.7, 0, -ja, 0);
      mf.box(col, cx - jx * 5, jy + 1.6, cz - jz * 5, 10, 0.9, 0.9, 0, -ja, 0);
      mf.box(mixc(C0.CEMENT, C0.NIGHT_TOP, 0.3, c), cx - jx * 8.5, jy + 1.4, cz - jz * 8.5, 2.4, 1.6, 1.6, 0, -ja, 0);
      mf.rod(C0.CEMENT, cx + jx * 18, jy + 1.3, cz + jz * 18, cx + jx * 18, jy - 10, cz + jz * 18, 0.07, PRIM.cyl6);
      mf.box(mixc(C0.RUST, C0.NIGHT_TOP, 0.2, c), cx + jx * 18, jy - 11, cz + jz * 18, 0.9, 1.2, 0.9);
      mw.box(mixc(C0.TERRACOTTA, C0.SUN, 0.2, c), cx, jy + 3.2, cz, 0.5, 0.5, 0.5);  // aircraft light
    }

    bake(m, W.MAT.plaster, 'cityMass');
    bake(mk, W.MAT.mason, 'cityLandmarks');
    bake(mf, W.MAT.flat, 'cityDetail');
    const glow = bake(mw, W.MAT.glowOff, 'cityWindows');
    if (glow) W.night.push(glow);
  }

  /* =========================================================================
     TIME OF DAY — four keyframes (dawn / noon / dusk / night), every colour
     mixed out of the shared palette so no new hues enter the world.
     ========================================================================= */
  function buildTOD() {
    const P = W.COL, nc = function () { return new T.Color(); };
    const mk = function (o) { return o; };
    return [
      mk({   // 0.00 — dawn haze
        top: mixc(P.NIGHT_TOP, P.SKY_TOP, 0.58, nc()),
        haze: mixc(P.SKY_HAZE, P.SUN, 0.34, nc()),
        fog: mixc(P.SKY_HAZE, P.SUN, 0.24, nc()),
        sun: mixc(P.SUN, P.FOAM, 0.28, nc()),
        amb: mixc(P.SEA_DEEP, P.SKY_HAZE, 0.55, nc()),
        gnd: mixc(P.STONE_WET, P.SEA_DEEP, 0.3, nc()),
        rock: mixc(P.STONE_DARK, P.NIGHT_TOP, 0.3, nc()),
        snow: mixc(P.FOAM, P.SUN, 0.3, nc()),
        glow: mixc(P.SUN, P.TERRACOTTA, 0.3, nc()),
        glowAmt: 0.55, sunI: 0.62, ambI: 0.5, hemI: 0.38, lamp: 0.55, el: 0.09, az: -1.15
      }),
      mk({   // 0.25 — hard noon glare
        top: nc().copy(P.SKY_TOP),
        haze: nc().copy(P.SKY_HAZE),
        fog: mixc(P.SKY_HAZE, P.FOAM, 0.3, nc()),
        sun: mixc(P.FOAM, P.SUN, 0.22, nc()),
        amb: mixc(P.SKY_HAZE, P.SKY_TOP, 0.35, nc()),
        gnd: mixc(P.LIMESTONE, P.SEA_SHALLOW, 0.25, nc()),
        rock: mixc(P.STONE_DARK, P.SEA_MID, 0.22, nc()),
        snow: nc().copy(P.FOAM),
        glow: mixc(P.FOAM, P.SUN, 0.35, nc()),
        glowAmt: 0.22, sunI: 1.12, ambI: 0.52, hemI: 0.5, lamp: 0.0, el: 0.95, az: 0.25
      }),
      mk({   // 0.50 — a proper Mediterranean dusk
        top: mixc(P.SKY_TOP, P.NIGHT_TOP, 0.42, nc()),
        haze: mixc(P.SUN, P.TERRACOTTA, 0.5, nc()),
        fog: mixc(P.TERRACOTTA, P.SKY_HAZE, 0.42, nc()),
        sun: mixc(P.SUN, P.TERRACOTTA, 0.55, nc()),
        amb: mixc(P.NIGHT_TOP, P.TERRACOTTA, 0.42, nc()),
        gnd: mixc(P.TERRACOTTA, P.SEA_DEEP, 0.45, nc()),
        rock: mixc(P.TERRACOTTA, P.NIGHT_TOP, 0.45, nc()),
        snow: mixc(P.FOAM, P.TERRACOTTA, 0.4, nc()),
        glow: mixc(P.SUN, P.TERRACOTTA, 0.45, nc()),
        glowAmt: 0.8, sunI: 0.62, ambI: 0.45, hemI: 0.34, lamp: 0.75, el: 0.06, az: 1.35
      }),
      mk({   // 0.75 — night
        top: nc().copy(P.NIGHT_TOP),
        haze: mixc(P.NIGHT_TOP, P.SEA_DEEP, 0.55, nc()),
        fog: mixc(P.NIGHT_TOP, P.SEA_DEEP, 0.4, nc()),
        sun: mixc(P.SEA_DEEP, P.FOAM, 0.3, nc()),             // moonlight
        amb: mixc(P.NIGHT_TOP, P.SEA_MID, 0.28, nc()),
        gnd: nc().copy(P.NIGHT_TOP),
        rock: mixc(P.NIGHT_TOP, P.SEA_MID, 0.18, nc()),
        snow: mixc(P.FOAM, P.NIGHT_TOP, 0.5, nc()),
        glow: mixc(P.SEA_MID, P.FOAM, 0.35, nc()),
        glowAmt: 0.25, sunI: 0.2, ambI: 0.34, hemI: 0.26, lamp: 1.0, el: 0.55, az: -0.4
      })
    ];
  }

  /* =========================================================================
     createWorld
     ========================================================================= */
  function createWorld(THREE, opts) {
    T = THREE;
    opts = opts || {};
    const pal = Object.assign({}, PALETTE, opts.palette || {});

    // scratch objects (shared, never retained)
    _v.a = new T.Vector3(); _v.b = new T.Vector3(); _v.c = new T.Vector3();
    _v.d = new T.Vector3(); _v.n = new T.Vector3();
    _v.col1 = new T.Color(); _v.col2 = new T.Color(); _v.col3 = new T.Color();
    _nm = new T.Matrix3(); _o3 = new T.Object3D(); _m4 = new T.Matrix4();
    initPrims();
    TEXS = [];

    const COL = {};
    for (const k in pal) if (typeof pal[k] === 'string') COL[k] = new T.Color(pal[k]);

    const group = new T.Group();
    group.name = 'world';
    W = {
      COL: COL, group: group, mats: [], geos: [], coll: [], night: [],
      palms: [], floaters: [], perches: [], gulls: [], ridges: [],
      sky: null, flag: null, flagBase: null, uncle: null, cat: null,
      catPost: null, smoke: null, gullMesh: null, cart: null
    };
    W.MAT = buildMaterials();

    /* ---- build order matters: the offshore build fills W.perches, the bollards fill
            W.catPost, both of which later builders consume ---- */
    W.sky = buildSky();
    W.ridges = buildMountains();
    buildCorniche();
    buildBalustrade();
    buildSaidaOffshore();
    buildCastle();
    buildCauseway();
    buildTrees();
    buildStreetFurniture();
    const kiosk = buildKioskAndCart();
    buildClutter();
    const sandPiles = buildSandPiles();
    buildFisherman();
    buildBoats();
    buildGulls();
    buildCity();

    /* ---- lights.  They live inside world.group so the scene is correct the
            moment the group is added; the game can kill them with
            world.setLightsEnabled(false) if it would rather own lighting. --- */
    const lights = new T.Group();
    lights.name = 'worldLights';
    const sun = new T.DirectionalLight(0xffffff, 1.0);
    sun.position.set(90, 160, -120);
    sun.castShadow = true;
    if (sun.shadow) {
      sun.shadow.mapSize.width = sun.shadow.mapSize.height = 1024;
      const cam = sun.shadow.camera;
      cam.left = -90; cam.right = 90; cam.top = 90; cam.bottom = -90;
      cam.near = 1; cam.far = 420;
    }
    const ambient = new T.AmbientLight(0xffffff, 0.5);
    const hemi = new T.HemisphereLight(0xffffff, 0x888888, 0.4);

  /* ------------------------------------------------------------ normalizers */
  function normTiers(list) {
    const out = [];
    for (let i = 0; i < TIER_FALLBACK.length; i++) {
      const f = TIER_FALLBACK[i], t = (list && list[i]) || {};
      out.push({
        idx: i,
        id: t.id || f.id,
        name: t.name || f.name,
        ar: t.ar || f.ar,
        hp: num(t.hp, num(t.maxHp, f.hp)),
        mortar: num(t.mortar, num(t.mortarCost, num(t.cost, f.mortar))),
        lira: num(t.lira, num(t.liraCost, f.lira)),
        color: t.color || t.colour || f.color
      });
    }
    return out;
  }

  // `unlocked` is accepted as [bool], [id], {id:bool} or a plain count.
  function normUnlocked(u, n) {
    const out = new Array(n);
    for (let i = 0; i < n; i++) out[i] = false;
    out[0] = true; // ramleh is always yours
    if (u == null) return out;
    if (typeof u === 'number') {
      for (let i = 0; i < n; i++) out[i] = i < u;
      out[0] = true; return out;
    }
    if (Array.isArray(u)) {
      if (u.length && typeof u[0] === 'string') {
        for (let i = 0; i < n; i++) out[i] = u.indexOf(TIER_FALLBACK[i].id) >= 0;
      } else {
        for (let i = 0; i < n; i++) out[i] = !!u[i];
      }
      out[0] = true; return out;
    }
    if (typeof u === 'object') {
      for (let i = 0; i < n; i++) out[i] = !!u[TIER_FALLBACK[i].id];
      out[0] = true; return out;
    }
    return out;
  }

      '--blb-wet': pal.STONE_WET, '--blb-terra': pal.TERRACOTTA, '--blb-cement': pal.CEMENT,
      '--blb-rust': pal.RUST, '--blb-palm': pal.PALM_GREEN, '--blb-sun': pal.SUN,
      '--blb-haz': pal.HAZARD, '--blb-night': pal.NIGHT_TOP, '--blb-skin': pal.SKIN,

                    '"Helvetica Neue Condensed",Impact,sans-serif',

  const SEA_BANDS = [
    { to: 0.12, en: 'calm',    ar: 'ساكن',  c: '--blb-ss' },
    { to: 0.30, en: 'ruffled', ar: 'نسمة',  c: '--blb-ss' },

    { to: 1.01, en: 'squall',  ar: 'عاصفة', c: '--blb-rust' }
  ];
  function seaBand(s) {
    for (let i = 0; i < SEA_BANDS.length; i++) if (s < SEA_BANDS[i].to) return SEA_BANDS[i];
    return SEA_BANDS[SEA_BANDS.length - 1];
  }

    function pickTier(i, fromUi) {
      i = clamp(i | 0, 0, tiers.length - 1);

    const btnStart = intro.querySelector('[data-start]');

    /* ================================================================== api */
    function setStats(s) {
      if (!s) return;
      if (s.mortar != null) S.mortar = num(s.mortar, S.mortar);
      if (s.mortarMax != null) S.mortarMax = Math.max(1, num(s.mortarMax, S.mortarMax));
      if (s.tiles != null) S.tiles = num(s.tiles, S.tiles);
      if (s.metres != null) S.metres = num(s.metres, S.metres);
      if (s.lira != null) S.lira = num(s.lira, S.lira);
      if (s.workers != null) S.workers = num(s.workers, S.workers);
      if (s.swell != null) S.swell = clamp(num(s.swell, S.swell), 0, 1);
      if (s.unlocked != null) S.unlocked = normUnlocked(s.unlocked, tiers.length);
      if (s.tierIdx != null) S.tierIdx = clamp(num(s.tierIdx, S.tierIdx) | 0, 0, tiers.length - 1);

      // if nobody is driving frame(), don't let the digits sit at zero
      const stale = frames === 0 || (now() - lastFrame) > 400;
      if (stale) {
        shown.metres = S.metres; shown.lira = S.lira;
        shown.tiles = S.tiles; shown.mortar = S.mortar;
      }
      paintTiers();
      paintNumbers();
      paintSea();
      if (shopOpen) renderShop(Object.assign({}, lastShopState, {
        lira: S.lira, mortar: S.mortar, mortarMax: S.mortarMax,

    function paintNumbers() {
      elMetres.textContent = fmt(shown.metres);
      elTiles.textContent = fmt(shown.tiles);
      elLira.textContent = fmt(shown.lira);
      elWorkers.textContent = fmt(S.workers);
      const m = Math.round(shown.mortar), mx = Math.round(S.mortarMax);
      elMv.textContent = fmt(m);
      elMm.textContent = '/ ' + fmt(mx);
      const f = clamp(S.mortarMax > 0 ? shown.mortar / S.mortarMax : 0, 0, 1);
      const top = 28 - f * 20;
      elBarrowFill.setAttribute('y', top.toFixed(2));
      elBarrowFill.setAttribute('height', (f * 20).toFixed(2));
      elBarrowSkin.setAttribute('y', top.toFixed(2));

      barrow.classList.toggle('low', f < 0.2);

    function paintSea() {
      const b = seaBand(S.swell);
      const squall = S.swell >= 0.72;
      elSeaName.textContent = 'Sea ' + b.en;
      elSeaAr.textContent = b.ar;
      sea.style.setProperty('--blb-swell', 'var(' + b.c + ')');
      sea.classList.toggle('squall', squall);
      elSeaCap.style.display = squall ? 'block' : 'none';
      const lit = Math.min(5, Math.max(1, Math.ceil(S.swell * 5)));
      for (let i = 0; i < pips.length; i++) pips[i].classList.toggle('on', i < lit);
    }

    // the sea line: amplitude and nervousness both rise with swell
    function paintWave() {
      const s = S.swell, amp = 1.6 + s * 8.4, n = 26;
      let d = '', df = 'M0,26 ';
      for (let i = 0; i <= n; i++) {
        const x = (i / n) * 120;
        const k = x * 0.085 + clock * (0.9 + s * 2.6);
        let y = 13 + Math.sin(k) * amp * 0.62 + Math.sin(k * 2.17 + 1.3) * amp * 0.3;
        if (s > 0.5) y += Math.sin(k * 5.3 + clock * 7) * (s - 0.5) * 3.4;
        y = clamp(y, 2, 24);
        d += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(2) + ' ';
        df += 'L' + x.toFixed(1) + ',' + y.toFixed(2) + ' ';
      }
      elWave.setAttribute('d', d.trim());
      elWaveFill.setAttribute('d', df + 'L120,26 Z');
    }

    function setPrompt(text) {
      if (text == null || text === '') {
        promptEl.classList.remove('on');
        elPromptTx.innerHTML = '';
        return;
      }
      elPromptTx.innerHTML = promptMarkup(text);
      promptEl.classList.add('on');

    function toast(text, kind) {
      const k = kind === 'good' || kind === 'bad' ? kind : 'info';
      const n = el('div', 'blb-plaque blb-toast ' + k + ' in',
        '<div class="bar"></div><div class="tx">' + esc(text) + '</div>');
      toasts.appendChild(n);
      const rec = { node: n, ttl: 3.1 + Math.min(2.2, String(text).length * 0.035), out: false };
      liveToasts.push(rec);
      // cap the stack so a burst of placements can't fill the screen
      while (liveToasts.length > 5) {
        const old = liveToasts.shift();
        if (old.node.parentNode) old.node.parentNode.removeChild(old.node);

      heckle.classList.remove('out');
      heckle.classList.remove('in');
      void heckle.offsetWidth; // restart the pop
      heckle.classList.add('in');

    /* ---- NPC speech ------------------------------------------------------
       One bubble per speaker, parked offscreen until the game tells us where
       that NPC currently projects to. The game owns the 3D->2D projection; we
       only own the look, the lifetime and the fade. */
    const sayLayer = el('div', 'blb-saylayer');
    r.appendChild(sayLayer);
    const bubbles = {};

    function say(id, opts) {
      opts = opts || {};
      let b = bubbles[id];
      if (!b) {
        const node = el('div', 'blb-say');
        node.innerHTML = '<div class="nm"></div><div class="tx"></div>' +
                         '<div class="ar blb-ar"></div><div class="tail"></div>';
        sayLayer.appendChild(node);
        b = bubbles[id] = {
          node: node, nm: node.querySelector('.nm'), tx: node.querySelector('.tx'),
          ar: node.querySelector('.ar'), ttl: 0, x: -9999, y: -9999, vis: false
        };
      }
      b.nm.textContent = opts.name || '';
      b.tx.textContent = String(opts.text == null ? '' : opts.text);
      if (opts.ar) { b.ar.textContent = opts.ar; b.ar.style.display = 'block'; }
      else { b.ar.style.display = 'none'; }
      b.ttl = num(opts.hold, 0) || (2.7 + Math.min(3.8, String(opts.text || '').length * 0.055));
      b.node.classList.remove('in');
      void b.node.offsetWidth;          // restart the pop
      b.node.classList.add('in');
      return b.ttl;
    }
    function anchorSpeech(id, x, y, visible) {
      const b = bubbles[id];
      if (!b) return;
      b.x = x; b.y = y; b.vis = !!visible;
    }
    function clearSpeech(id) {
      const b = bubbles[id];
      if (b) b.ttl = 0;
    }
    function isSaying(id) {
      const b = bubbles[id];
      return !!(b && b.ttl > 0);
    }
    function tickSpeech(dt) {
      for (const id in bubbles) {
        if (!bubbles.hasOwnProperty(id)) continue;
        const b = bubbles[id];
        if (b.ttl > 0) b.ttl -= dt;
        const on = b.ttl > 0 && b.vis;
        if (on) {
          b.node.style.display = 'block';
          // keep the bubble on screen when the speaker is near an edge
          const bw = b.node.offsetWidth, bh = b.node.offsetHeight;
          const x = Math.min(Math.max(b.x, bw / 2 + 10), window.innerWidth - bw / 2 - 10);
          const y = Math.max(b.y, bh + 14);
          b.node.style.left = Math.round(x) + 'px';
          b.node.style.top = Math.round(y) + 'px';
        } else if (b.node.style.display !== 'none') {
          b.node.style.display = 'none';
          b.node.classList.remove('in');
        }
      }
    }

    function setReticle(state) {

    /* ---------------------------------------------------------- frame ticker */
    function frame(dt) {
      tickSpeech(dt);
      dt = num(dt, 0.016);
      if (dt > 1) dt /= 1000;          // tolerate milliseconds
      dt = clamp(dt, 0, 0.1);
      lastFrame = now();
      frames++;
      if (!reduced) clock += dt;

      // digits roll toward their target so the hero figure feels earned
      const k = reduced ? 1 : clamp(dt * 9, 0, 1);
      let dirty = false;
      ['metres', 'lira', 'tiles', 'mortar'].forEach(function (key) {
        const t = S[key], c = shown[key];
        if (Math.abs(t - c) < 0.02) { if (c !== t) { shown[key] = t; dirty = true; } return; }
        shown[key] = lerp(c, t, k);
        dirty = true;
      });
      if (dirty) paintNumbers();

      paintWave();

      // squall jitter: the plaque itself gets nervous
      if (!reduced && S.swell > 0.74) {
        shake = (S.swell - 0.74) * 4;
        sea.style.transform = 'translate(' + (Math.random() - 0.5) * shake +
          'px,' + (Math.random() - 0.5) * shake + 'px)';
      } else if (shake !== 0) {
        shake = 0;
        sea.style.transform = '';
      }

      for (let i = liveToasts.length - 1; i >= 0; i--) {
        const t = liveToasts[i];
        t.ttl -= dt;
        if (t.ttl <= 0 && !t.out) { t.out = true; t.node.classList.add('out'); }
        if (t.ttl <= -0.45) {
          if (t.node.parentNode) t.node.parentNode.removeChild(t.node);
          liveToasts.splice(i, 1);
        }
      }

      if (heckleTtl > 0) {
        heckleTtl -= dt;
        if (heckleTtl <= 0) {
          heckle.classList.add('out');
          heckleTtl = -1;
          setTimeout(function () {
            if (heckleTtl < 0) heckle.style.display = 'none';
          }, 420);
        }
      }
    }

    /* -------------------------------------------------------------- keyboard */
    // 1-4 picks a tile, Esc shuts the kiosk. Pass keys:false to own these.
    const wantKeys = opts.keys !== false;
    function onKey(e) {
      if (!wantKeys || e.ctrlKey || e.metaKey || e.altKey) return;
      const tgt = e.target;
      if (tgt && (tgt.tagName === 'INPUT' || tgt.tagName === 'TEXTAREA' ||
          tgt.tagName === 'SELECT' || tgt.isContentEditable)) return;
      if (e.key === 'Escape' && shopOpen) { closeShop(); e.preventDefault(); return; }
      if (introOpen) return;
      if (e.key >= '1' && e.key <= '4') {
        const i = parseInt(e.key, 10) - 1;
        if (i < tiers.length) { pickTier(i, true); e.preventDefault(); }
      }
    }
    window.addEventListener('keydown', onKey);

    /* ------------------------------------------------------------- mount it */
    // .blb is absolutely positioned; if the handed-in root is static the
    // overlay would escape to the nearest positioned ancestor instead.
    try {
      if (host !== document.body &&
          window.getComputedStyle(host).position === 'static') {
        host.style.position = 'relative';
      }
    } catch (e) {}
    host.appendChild(r);
    paintTiers();
    paintNumbers();
    paintSea();
    paintWave();

    const hud = {
      root: r,
      tiers: tiers,
      HECKLES: HECKLES,
      setStats: setStats,
      setPrompt: setPrompt,
      toast: toast,
      heckle: doHeckle,
      say: say,
      anchorSpeech: anchorSpeech,
      clearSpeech: clearSpeech,
      isSaying: isSaying,
      setPhase: setPhase,
      openShop: openShop,
      closeShop: closeShop,
      showIntro: showIntro,
      hideIntro: hideIntro,
      setLoading: setLoading,
      frame: frame,
      // extras, all optional for the orchestrator
      setReticle: setReticle,
      selectTier: function (i) { pickTier(i, false); },
      setMuted: function (m) { return toggleSound(!!m); },
      isMuted: function () { return muted; },
      isShopOpen: function () { return shopOpen; },
      isIntroOpen: function () { return introOpen; },
      randomHeckle: function () {
        return HECKLES[(Math.random() * HECKLES.length) | 0];
      },
      dispose: function () {
        window.removeEventListener('keydown', onKey);
        if (r.parentNode) r.parentNode.removeChild(r);
      }
    };
    hud.destroy = hud.dispose;
    return hud;
  }

  function now() {
    return (window.performance && performance.now) ? performance.now() : Date.now();
  }

  /* ===================================================== BLB_HUD.createAudio */
  /* Everything is synthesised. No files, no network, no decoding.
     One AudioContext, created lazily and resumed in unlock(). One white-noise
     buffer, reused by every noise voice. Every source is given a stop time and
     disconnects itself on 'ended', so nothing can leak. */
  function createAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    let ctx = null, master = null, noiseBuf = null;
    let surfSrc = null, surfLP = null, surfGain = null, hissBP = null, hissGain = null;
    let lfo = null, lfoGain = null, started = false;
    let muted = false, voices = 0;
    const MAX_VOICES = 48;

    function ensure() {
      if (ctx || !AC) return ctx;
      try { ctx = new AC(); } catch (e) { ctx = null; return null; }

      master = ctx.createGain();
      master.gain.value = muted ? 0 : 0.85;
      master.connect(ctx.destination);

      noiseBuf = makeNoise(2);

      // --- surf bed: one looping noise source, split into body and hiss ----
      surfSrc = ctx.createBufferSource();
      surfSrc.buffer = noiseBuf;
      surfSrc.loop = true;

      surfLP = ctx.createBiquadFilter();
      surfLP.type = 'lowpass';
      surfLP.frequency.value = 500;
      surfLP.Q.value = 0.4;

      surfGain = ctx.createGain();
      surfGain.gain.value = 0.015;

      surfSrc.connect(surfLP);
      surfLP.connect(surfGain);
      surfGain.connect(master);

      hissBP = ctx.createBiquadFilter();
      hissBP.type = 'bandpass';
      hissBP.frequency.value = 3200;
      hissBP.Q.value = 0.7;

      hissGain = ctx.createGain();
      hissGain.gain.value = 0;

      surfSrc.connect(hissBP);
      hissBP.connect(hissGain);
      hissGain.connect(master);

      // slow breathing of the swell, summed into the surf gain param
      lfo = ctx.createOscillator();
      lfo.type = 'sine';
      lfo.frequency.value = 0.085;
      lfoGain = ctx.createGain();
      lfoGain.gain.value = 0.008;
      lfo.connect(lfoGain);
      lfoGain.connect(surfGain.gain);

      return ctx;
    }

    function makeNoise(sec) {
      const n = Math.floor(ctx.sampleRate * sec);
      const b = ctx.createBuffer(1, n, ctx.sampleRate);
      const d = b.getChannelData(0);
      // white noise, de-DC'd and cross-faded at the seam so the loop is seamless
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      const fade = Math.min(1200, (n / 4) | 0);
      for (let i = 0; i < fade; i++) {
        const k = i / fade;
        d[i] = d[i] * k + d[n - fade + i] * (1 - k);
      }
      return b;
    }

    function start() {
      if (started || !ctx) return;
      started = true;
      try { surfSrc.start(0); lfo.start(0); } catch (e) {}
    }

    // every voice routes through here so a stuck node is impossible
    function track(node, stopAt) {
      voices++;
      node.onended = function () {
        voices--;
        try { node.disconnect(); } catch (e) {}
        node.onended = null;
      };
      try { node.stop(stopAt); } catch (e) {}
    }

    function busy() { return !ctx || voices > MAX_VOICES; }

    function pan(amount) {
      if (!ctx.createStereoPanner) return null;
      const p = ctx.createStereoPanner();
      p.pan.value = clamp(amount, -1, 1);
      return p;
    }

    // dest helper: build a gain with an exponential pluck envelope
    function envGain(t, peak, atk, dec) {
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + atk);
      g.gain.exponentialRampToValueAtTime(0.0001, t + atk + dec);
      return g;
    }

    function noiseVoice(t, dur, filt, freq, q, peak, atk, dec, out) {
      const s = ctx.createBufferSource();
      s.buffer = noiseBuf;
      s.playbackRate.value = 0.9 + Math.random() * 0.3;
      const off = Math.random() * (noiseBuf.duration - dur - 0.02);
      const f = ctx.createBiquadFilter();
      f.type = filt;
      f.frequency.value = freq;
      f.Q.value = q;
      const g = envGain(t, peak, atk, dec);
      s.connect(f); f.connect(g); g.connect(out || master);
      try { s.start(t, Math.max(0, off), dur + 0.02); } catch (e) { s.start(t); }
      track(s, t + dur + 0.05);
      return f;
    }

    /* ------------------------------------------------------------- the clack */
    // The core feedback loop of the whole game: a glazed tile set into wet
    // mortar. Three inharmonic partials (ceramic, not bell), a grit transient,
    // and a low body knock. Pitch snaps to a pentatonic degree so a fast run of
    // tiles comes out as a phrase instead of a machine gun.
    const DEGREES = [0, 2, 4, 7, 9, 12, 14, 16];
    let lastDeg = -1;
    function clack() {
      const c = ensure(); if (busy()) return;
      const t = c.currentTime + 0.001;
      let di = (Math.random() * DEGREES.length) | 0;
      if (di === lastDeg) di = (di + 1) % DEGREES.length; // avoid flat repeats
      lastDeg = di;
      const base = 760 * Math.pow(2, DEGREES[di] / 12) * (1 + (Math.random() - 0.5) * 0.02);

      const out = ctx.createGain();
      out.gain.value = 0.9;
      const p = pan((Math.random() - 0.5) * 0.5);
      if (p) { out.connect(p); p.connect(master); } else { out.connect(master); }

      const RAT = [1, 2.71, 5.07], AMP = [0.26, 0.1, 0.045], DEC = [0.19, 0.11, 0.055];
      for (let i = 0; i < RAT.length; i++) {
        const o = ctx.createOscillator();
        o.type = i === 0 ? 'triangle' : 'sine';
        o.frequency.value = base * RAT[i] * (1 + (Math.random() - 0.5) * 0.01);
        const g = envGain(t, AMP[i], 0.003, DEC[i]);
        o.connect(g); g.connect(out);
        o.start(t);
        track(o, t + DEC[i] + 0.06);
      }
      // the chink of grit between tile and mortar
      noiseVoice(t, 0.03, 'bandpass', base * 2.3, 2.2, 0.12, 0.001, 0.028, out);
      // the dull knock of the bed taking the weight
      const k = ctx.createOscillator();
      k.type = 'sine';
      k.frequency.setValueAtTime(190 + Math.random() * 40, t);
      k.frequency.exponentialRampToValueAtTime(96, t + 0.09);
      const kg = envGain(t, 0.16, 0.004, 0.085);
      k.connect(kg); kg.connect(out);
      k.start(t);
      track(k, t + 0.14);
    }

    /* ------------------------------------------------------------ pour / mix */
    function pour() {
      const c = ensure(); if (busy()) return;
      const t = c.currentTime + 0.001;
      const f = noiseVoice(t, 0.5, 'bandpass', 2400, 1.1, 0.2, 0.05, 0.42);
      if (f) {
        f.frequency.setValueAtTime(2400, t);
        f.frequency.exponentialRampToValueAtTime(620, t + 0.46);
      }
      // individual stones landing
      for (let i = 0; i < 5; i++) {
        const tt = t + 0.02 + Math.random() * 0.4;
        noiseVoice(tt, 0.03, 'highpass', 1800 + Math.random() * 2200, 0.8,
          0.05 + Math.random() * 0.04, 0.002, 0.026);
      }
    }

    /* --------------------------------------------------------- tile crumbling */
    function crumble() {
      const c = ensure(); if (busy()) return;
      const t = c.currentTime + 0.001;
      const f = noiseVoice(t, 0.55, 'lowpass', 1900, 1.4, 0.26, 0.006, 0.5);
      if (f) {
        f.frequency.setValueAtTime(1900, t);
        f.frequency.exponentialRampToValueAtTime(260, t + 0.5);
      }
      const n = 7;
      for (let i = 0; i < n; i++) {
        const tt = t + 0.01 + Math.random() * 0.34;
        noiseVoice(tt, 0.045, 'bandpass', 420 + Math.random() * 1500, 3.2,
          0.07 + Math.random() * 0.06, 0.002, 0.04);
      }
      const o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(140, t);
      o.frequency.exponentialRampToValueAtTime(58, t + 0.3);
      const g = envGain(t, 0.17, 0.008, 0.3);
      o.connect(g); g.connect(master);
      o.start(t);
      track(o, t + 0.36);
    }

    /* ---------------------------------------------------------------- splash */
    function splash() {
      const c = ensure(); if (busy()) return;
      const t = c.currentTime + 0.001;
      const f = noiseVoice(t, 0.5, 'bandpass', 700, 0.8, 0.22, 0.012, 0.46);
      if (f) {
        f.frequency.setValueAtTime(700, t);
        f.frequency.exponentialRampToValueAtTime(3000, t + 0.13);
        f.frequency.exponentialRampToValueAtTime(900, t + 0.48);
      }
      const o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(260, t);
      o.frequency.exponentialRampToValueAtTime(70, t + 0.22);
      const g = envGain(t, 0.14, 0.006, 0.22);
      o.connect(g); g.connect(master);
      o.start(t);
      track(o, t + 0.3);
      for (let i = 0; i < 3; i++) {
        noiseVoice(t + 0.16 + Math.random() * 0.3, 0.035, 'bandpass',
          2600 + Math.random() * 2400, 4, 0.05, 0.002, 0.03);
      }
    }

    /* ------------------------------------------------------------------ gull */
    function gull() {
      const c = ensure(); if (busy()) return;
      let t = c.currentTime + 0.001;
      const cries = 2 + ((Math.random() * 2) | 0);
      const top = 1250 + Math.random() * 450;
      const bus = ctx.createGain();
      bus.gain.value = 1;
      const p = pan((Math.random() - 0.5) * 1.3);
      if (p) { bus.connect(p); p.connect(master); } else { bus.connect(master); }
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 1700;
      bp.Q.value = 2.4;
      bp.connect(bus);
      for (let i = 0; i < cries; i++) {
        const f0 = top * Math.pow(0.9, i), dur = 0.2 + Math.random() * 0.08;
        const o = ctx.createOscillator();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(f0 * 0.55, t);
        o.frequency.exponentialRampToValueAtTime(f0, t + 0.045);
        o.frequency.exponentialRampToValueAtTime(f0 * 0.45, t + dur);
        // the ragged vibrato that makes it a gull and not a theremin
        const vib = ctx.createOscillator();
        vib.type = 'sine';
        vib.frequency.value = 26 + Math.random() * 10;
        const vg = ctx.createGain();
        vg.gain.value = f0 * 0.05;
        vib.connect(vg); vg.connect(o.frequency);
        const g = envGain(t, 0.075, 0.03, dur);
        o.connect(g); g.connect(bp);
        o.start(t); vib.start(t);
        track(o, t + dur + 0.08);
        track(vib, t + dur + 0.08);
        t += dur + 0.1 + Math.random() * 0.1;
      }
    }

    /* ----------------------------------------------------------- ui + chime */
    function ui() {
      const c = ensure(); if (busy()) return;
      const t = c.currentTime + 0.001;
      const o = ctx.createOscillator();
      o.type = 'square';
      o.frequency.setValueAtTime(1180, t);
      o.frequency.exponentialRampToValueAtTime(880, t + 0.05);
      const f = ctx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = 2600;
      const g = envGain(t, 0.05, 0.002, 0.048);
      o.connect(f); f.connect(g); g.connect(master);
      o.start(t);
      track(o, t + 0.09);
    }

    /* A muttered syllable or two, pitched per character — enough to read as
       "someone said something" without pretending to be speech. */
    function voiceBlip(voice) {
      const c = ensure(); if (busy()) return;
      const base = 190 + ((voice | 0) % 5) * 46;
      const t0 = c.currentTime + 0.001;
      const n = 2 + ((Math.random() * 2) | 0);
      for (let i = 0; i < n; i++) {
        const t = t0 + i * (0.085 + Math.random() * 0.035);
        const o = ctx.createOscillator();
        o.type = 'triangle';
        const f0 = base * (0.88 + Math.random() * 0.3);
        o.frequency.setValueAtTime(f0, t);
        o.frequency.linearRampToValueAtTime(f0 * (0.82 + Math.random() * 0.4), t + 0.06);
        const fl = ctx.createBiquadFilter();
        fl.type = 'bandpass';
        fl.frequency.value = base * 3.1;
        fl.Q.value = 1.4;
        const g = envGain(t, 0.075, 0.006, 0.062);
        o.connect(fl); fl.connect(g); g.connect(master);
        o.start(t);
        track(o, t + 0.1);
      }
    }

    function purchase() {
      const c = ensure(); if (busy()) return;
      const t0 = c.currentTime + 0.001;
      const steps = [0, 4, 7, 12];
      for (let i = 0; i < steps.length; i++) {
        const t = t0 + i * 0.075;
        const o = ctx.createOscillator();
        o.type = 'triangle';
        o.frequency.value = 523.25 * Math.pow(2, steps[i] / 12);
        const g = envGain(t, 0.1, 0.004, 0.16);
        const o2 = ctx.createOscillator();
        o2.type = 'sine';
        o2.frequency.value = 523.25 * Math.pow(2, steps[i] / 12) * 2.01;
        const g2 = envGain(t, 0.035, 0.004, 0.1);
        o.connect(g); g.connect(master);
        o2.connect(g2); g2.connect(master);
        o.start(t); o2.start(t);
        track(o, t + 0.22);
        track(o2, t + 0.16);
      }
    }

    /* --------------------------------------------------------------- the sea */
    function wash(level) {
      const c = ensure(); if (!c) return;
      const l = clamp(num(level, 0), 0, 1);
      const t = c.currentTime, tc = 0.7;
      surfGain.gain.setTargetAtTime(0.012 + l * 0.2, t, tc);
      surfLP.frequency.setTargetAtTime(420 + l * 3400, t, tc);
      hissGain.gain.setTargetAtTime(l * l * 0.06, t, tc);
      hissBP.frequency.setTargetAtTime(2600 + l * 2600, t, tc);
      lfoGain.gain.setTargetAtTime(0.006 + l * 0.055, t, tc);
      lfo.frequency.setTargetAtTime(0.07 + l * 0.17, t, 2);
    }

    const sfx = {
      clack: clack, pour: pour, crumble: crumble, splash: splash,
      gull: gull, ui: ui, purchase: purchase, wash: wash, say: voiceBlip,
      unlock: function () {
        const c = ensure();
        if (!c) return;
        if (c.state === 'suspended' && c.resume) { try { c.resume(); } catch (e) {} }
        start();
      },
      get muted() { return muted; },
      set muted(v) {
        muted = !!v;
        if (master && ctx) {
          master.gain.setTargetAtTime(muted ? 0 : 0.85, ctx.currentTime, 0.04);
        }
      },
      get context() { return ctx; },
      dispose: function () {
        if (!ctx) return;
        try { surfSrc.stop(0); lfo.stop(0); } catch (e) {}
        try { ctx.close(); } catch (e) {}
        ctx = null; started = false;
      }
    };
    return sfx;
  }

  window.BLB_HUD = {
    create: create,
    createAudio: createAudio,
    HECKLES: HECKLES,
    PALETTE: P,
    TIERS: TIER_FALLBACK,
    PRICES: PRICE
  };
})();

/* ==== game.js ==== */
/* BALLET L BA7ER — core engine / integration layer.

 * and the main loop. Scenery comes from BLB_WORLD, simulation from BLB_PHYSICS,

(function () {

    FOAM: 0xedf6f3, SKY_TOP: 0x6fc3de, SKY_HAZE: 0xd9eef2,
    LIMESTONE: 0xe4d7b3, STONE_DARK: 0xa08f6a, STONE_WET: 0x7d6e4f,
    TERRACOTTA: 0xb9502f, CEMENT: 0x9aa0a0, RUST: 0x8c4a2f,

    SUN: 0xf6c445, HAZARD: 0xf2b733, NIGHT_TOP: 0x0a1a33,

  /* One tile. One material. One thing to collect. The whole game is the

  var TIERS = [
    { id: 'balat', name: 'Balat', ar: 'بلاط', hp: 14, mortar: 1, lira: 0, color: 0x2e7fa8 }
  ];
  var HUD_TIERS = TIERS.map(function (t) {
    return { id: t.id, name: t.name, ar: t.ar, hp: t.hp, mortar: t.mortar, lira: t.lira,

  var INSPECTION_EVERY = 30;   // municipality pays by the surviving square metre
  var SAVE_KEY = 'blb.save.v2';

  // -------------------------------------------------------------- utilities
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  function cellCentreX(i) { return i * CELL; }

  function noise1(x) {
    var i = Math.floor(x), f = x - i;
    function h(n) { n = (n << 13) ^ n; return 1.0 - ((n * (n * n * 15731 + 789221) + 1376312589) & 0x7fffffff) / 1073741824.0; }
    var u = f * f * (3 - 2 * f);

  // --------------------------------------------------- procedural materials
  function canvas2d(size) {

  /* One 2m slab reads as four laid balatat, so the grout grid does the work.
     Each tier gets its own surface: raw sand-mix, poured beton, the azure
     qarmid with its little star motif, and veined Rmeyleh marble. */
  function tileTexture(tier) {
    var S = 128, o = canvas2d(S), g = o.g, i;
    g.fillStyle = hex(tier.color);
    g.fillRect(0, 0, S, S);
    if (tier.id === 'ramleh') {
      for (i = 0; i < 2600; i++) {
        g.fillStyle = 'rgba(' + (110 + Math.random() * 90 | 0) + ',' + (95 + Math.random() * 70 | 0) + ',60,0.30)';
        g.fillRect(Math.random() * S, Math.random() * S, 2, 2);
      }
    } else if (tier.id === 'beton') {
      for (i = 0; i < 1800; i++) {
        var v = Math.random() < 0.5 ? 255 : 40;
        g.fillStyle = 'rgba(' + v + ',' + v + ',' + v + ',0.10)';
        g.fillRect(Math.random() * S, Math.random() * S, 3, 3);
      }
      g.strokeStyle = 'rgba(60,70,70,0.35)';          // a trowelled-over crack
      g.lineWidth = 2; g.beginPath();
      g.moveTo(10, 40); g.bezierCurveTo(50, 60, 70, 20, 118, 52); g.stroke();
    } else if (tier.id === 'qarmid') {
      // four azure balatat, each with a white eight-point star — Levantine kitchen tile
      for (var qx = 0; qx < 2; qx++) for (var qy = 0; qy < 2; qy++) {
        var cx = qx * 64 + 32, cy = qy * 64 + 32;
        g.fillStyle = 'rgba(255,255,255,0.14)';
        g.fillRect(qx * 64 + 6, qy * 64 + 6, 52, 52);
        g.save(); g.translate(cx, cy);
        for (var r = 0; r < 2; r++) {
          g.rotate(Math.PI / 4);
          g.fillStyle = r ? hex(P.FOAM) : 'rgba(237,246,243,0.55)';
          g.fillRect(-17, -5, 34, 10); g.fillRect(-5, -17, 10, 34);
        }
        g.fillStyle = hex(P.HAZARD); g.beginPath(); g.arc(0, 0, 4.5, 0, 6.3); g.fill();
        g.restore();

    } else {
      for (i = 0; i < 26; i++) {                       // marble veining
        g.strokeStyle = 'rgba(150,140,120,' + (0.10 + Math.random() * 0.22).toFixed(2) + ')';
        g.lineWidth = 0.6 + Math.random() * 1.8;
        g.beginPath();
        var x0 = Math.random() * S, y0 = Math.random() * S;
        g.moveTo(x0, y0);
        g.bezierCurveTo(x0 + 30, y0 + 20, x0 - 20, y0 + 50, x0 + 40, y0 + 90);
        g.stroke();
      }

    g.strokeStyle = 'rgba(55,50,40,0.55)'; g.lineWidth = 5;
    g.beginPath(); g.moveTo(64, 0); g.lineTo(64, S); g.moveTo(0, 64); g.lineTo(S, 64); g.stroke();
    g.lineWidth = 7; g.strokeRect(0, 0, S, S);

    grd.addColorStop(0, 'rgba(0,0,0,0)'); grd.addColorStop(1, 'rgba(0,0,0,0.13)');

  }

  function particleSpriteUnused() { /* splash sprites live in BLB_PHYSICS */ }

  // ------------------------------------------------------------ tile render
  /* One InstancedMesh per tier; removal swaps the hole with the last instance.
     Per-instance colour carries wear, so a frontier tile visibly goes grey and
     tired before the sea finally takes it. */
  function createTileRenderer(scene) {
    var MAX = 5000;
    var banks = TIERS.map(function (tier) {
      var geo = new THREE.BoxGeometry(1.94, TILE_TOP, 1.94);
      var mat = new THREE.MeshPhongMaterial({ map: tileTexture(tier), flatShading: true, shininess: 8, specular: 0x2a2a28 });
      var mesh = new THREE.InstancedMesh(geo, mat, MAX);
      mesh.count = 0;
      mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      mesh.frustumCulled = false;
      scene.add(mesh);
      /* Allocate instanceColor ourselves. r128's setColorAt() sizes the buffer
         from mesh.count, and we have just set that to 0 — so priming through
         setColorAt would allocate a ZERO-LENGTH colour buffer while the shader
         still compiles with USE_INSTANCING_COLOR. Every instanced draw then
         fails with GL_INVALID_OPERATION and the tiles silently never appear. */
      var carr = new Float32Array(MAX * 3);
      var tc = new THREE.Color(tier.color);
      for (var n = 0; n < MAX; n++) {
        carr[n * 3] = tc.r; carr[n * 3 + 1] = tc.g; carr[n * 3 + 2] = tc.b;
      }
      mesh.instanceColor = new THREE.BufferAttribute(carr, 3);
      mesh.instanceColor.setUsage(THREE.DynamicDrawUsage);
      return { mesh: mesh, occupants: new Array(MAX), tier: tier };
    });
    var slotOf = {};                 // "i,j" -> {tierIdx, idx}
    var m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
    var pos = new THREE.Vector3(), scl = new THREE.Vector3(1, 1, 1), col = new THREE.Color();

    function key(i, j) { return i + ',' + j; }

    function add(i, j, tierIdx) {
      var bank = banks[tierIdx], idx = bank.mesh.count++;
      // hand-laid, not machine-laid: a degree of yaw and a hair of lift
      e.set(0, (Math.random() - 0.5) * 0.055, 0);
      q.setFromEuler(e);
      pos.set(cellCentreX(i), TILE_TOP / 2 + (Math.random() - 0.5) * 0.012, cellCentreZ(j));
      m.compose(pos, q, scl);
      bank.mesh.setMatrixAt(idx, m);
      // instanceColor carries the tier hue; the material stays white so wear
      // is a plain multiply later on.
      var vary = 0.93 + Math.random() * 0.14;
      col.setHex(bank.tier.color).multiplyScalar(vary);
      bank.mesh.setColorAt(idx, col);
      bank.occupants[idx] = key(i, j);
      slotOf[key(i, j)] = { t: tierIdx, i: idx };
      bank.mesh.instanceMatrix.needsUpdate = true;
      if (bank.mesh.instanceColor) bank.mesh.instanceColor.needsUpdate = true;

      var kk = key(i, j), slot = slotOf[kk];
      if (!slot) return;

      if (slot.i !== last) {                      // move the tail into the hole
        bank.mesh.getMatrixAt(last, m);
        bank.mesh.setMatrixAt(slot.i, m);
        if (bank.mesh.instanceColor) {
          var ic = bank.mesh.instanceColor.array;
          ic[slot.i * 3] = ic[last * 3];
          ic[slot.i * 3 + 1] = ic[last * 3 + 1];
          ic[slot.i * 3 + 2] = ic[last * 3 + 2];
          bank.mesh.instanceColor.needsUpdate = true;

        var movedKey = bank.occupants[last];
        bank.occupants[slot.i] = movedKey;
        if (slotOf[movedKey]) slotOf[movedKey].i = slot.i;

      bank.mesh.count = last;
      bank.occupants[last] = undefined;
      bank.mesh.instanceMatrix.needsUpdate = true;
      delete slotOf[kk];

    /* Wear pass: only the frontier can be damaged, so only the frontier is

    function wear(tile) {

      col.setHex(bank.tier.color);

      var grey = (col.r + col.g + col.b) / 3;

        lerp(grey * 0.72, col.r, 0.35 + 0.65 * ratio) * dull,
        lerp(grey * 0.78, col.g, 0.35 + 0.65 * ratio) * dull,
        lerp(grey * 0.74, col.b, 0.35 + 0.65 * ratio) * dull

      bank.mesh.setColorAt(slot.i, col);
      if (bank.mesh.instanceColor) bank.mesh.instanceColor.needsUpdate = true;
    }

    function clear() {
      banks.forEach(function (b) { b.mesh.count = 0; b.occupants.length = 0; b.occupants.length = MAX; });
      slotOf = {};
    }

  }

  // ------------------------------------------------------------------- sea
  /* A flat-shaded plane that follows the player and is displaced on the CPU
     from the very same wave field the simulation uses, so a splash, a bobbing
     boat and the tile that just drowned all agree with what you can see.
     flatShading derives normals in the fragment shader, so there is no
     per-frame computeVertexNormals — that is what makes this affordable. */
  function createSea(scene, waves) {
    var SIZE = 720, SEG = 144, STEP = SIZE / SEG;   // 5m snap, integer
    var geo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
    geo.rotateX(-Math.PI / 2);
    var pos = geo.attributes.position, N = pos.count;
    var parr = pos.array;
    var bx = new Float32Array(N), bz = new Float32Array(N);

       silently ignores flatShading. We never recompute the wave normals, so
       without real flat shading the sea would render as an unlit flat sheet.
       The low specular doubles as sun glint on the water. */
    var mat = new THREE.MeshPhongMaterial({

    var sr = (P.SEA_SHALLOW >> 16 & 255) / 255, sg = (P.SEA_SHALLOW >> 8 & 255) / 255, sb = (P.SEA_SHALLOW & 255) / 255;
    var dr = (P.SEA_DEEP >> 16 & 255) / 255, dg = (P.SEA_DEEP >> 8 & 255) / 255, db = (P.SEA_DEEP & 255) / 255;
    var fr = (P.FOAM >> 16 & 255) / 255, fg = (P.FOAM >> 8 & 255) / 255, fb = (P.FOAM & 255) / 255;

      var cx = Math.round(px / STEP) * STEP, cz = Math.round(pz / STEP) * STEP;

        var d = wz < 4 ? 0 : (wz - 4) / 300;

  // ----------------------------------------------------------- the mason

  function createMason(shirtColor, hatColor, hatStyle) {

      steel: new THREE.MeshPhongMaterial({ color: 0xb9bec2, flatShading: true, shininess: 60, specular: 0x888888 })

    var hips = new THREE.Group(); hips.position.y = 0.82; g.add(hips);

    var torso = box(0.56, 0.58, 0.32, M.shirt, 0, 0.42, 0, hips);  // fanella
    box(0.10, 0.44, 0.04, M.denim, -0.16, 0.50, -0.15, hips);      // straps
    box(0.10, 0.44, 0.04, M.denim, 0.16, 0.50, -0.15, hips);
    var head = new THREE.Group(); head.position.set(0, 0.86, 0); hips.add(head);
    box(0.36, 0.34, 0.32, M.skin, 0, 0.17, 0, head);
    box(0.17, 0.05, 0.03, M.dark, 0, 0.11, 0.17, head);            // the moustache
    box(0.05, 0.05, 0.02, M.dark, -0.08, 0.22, 0.17, head);
    box(0.05, 0.05, 0.02, M.dark, 0.08, 0.22, 0.17, head);
    hatStyle = hatStyle || 'hard';
    if (hatStyle === 'hard') {
      box(0.42, 0.10, 0.40, M.hat, 0, 0.38, 0, head);              // hard hat
      box(0.30, 0.09, 0.30, M.hat, 0, 0.45, 0, head);
      box(0.40, 0.04, 0.13, M.hat, 0, 0.345, 0.21, head);          // brim
    } else if (hatStyle === 'cap') {

      box(0.34, 0.035, 0.16, M.hat, 0, 0.345, 0.22, head);
    } else if (hatStyle === 'scarf') {
      box(0.44, 0.34, 0.42, M.hat, 0, 0.20, -0.02, head);          // headscarf
      box(0.30, 0.22, 0.12, M.hat, 0, 0.02, -0.19, head);

    }

    var armR = limb(0.34, 0.70, 0, 0.15, 0.56, 0.17, M.skin, hips);
    box(0.04, 0.22, 0.14, M.steel, 0, -0.60, 0.06, armR);          // trowel
    var legL = limb(-0.15, 0, 0, 0.20, 0.76, 0.24, M.denim, hips);
    var legR = limb(0.15, 0, 0, 0.20, 0.76, 0.24, M.denim, hips);
    box(0.22, 0.06, 0.30, M.dark, -0.15, -0.79, 0.03, hips);       // slippers
    box(0.22, 0.06, 0.30, M.dark, 0.15, -0.79, 0.03, hips);

    var state = { phase: 0, lay: 0, swim: 0 };
    function animate(dt, speed, inWater, laying) {
      state.phase += dt * (3.2 + speed * 1.15);
      state.lay = clamp(state.lay + (laying ? dt * 7 : -dt * 5), 0, 1);
      state.swim = clamp(state.swim + (inWater ? dt * 4 : -dt * 4), 0, 1);

      armL.rotation.x = (-s * 0.62 * sp) * (1 - sw) + sw * (Math.sin(state.phase * 1.6) * 1.5 - 1.4);

      var L = state.lay;
      hips.position.y = 0.82 - L * 0.30 - sw * 0.55 + Math.abs(c) * 0.02 * sp * (1 - sw);
      hips.rotation.x = L * 0.55 + sw * 1.30;
      armR.rotation.x += -L * 1.25 + Math.sin(state.phase * 6) * 0.30 * L;
      armL.rotation.x += -L * 0.45;
      head.rotation.x = -L * 0.35 - sw * 0.9;

      legR.rotation.x += sw * (Math.cos(state.phase * 1.9) * 0.55 + 0.9);

  // ================================================================ boot
  function boot(saved) {
    var canvas = document.getElementById('webgl');

        '#tbtns button{font:700 19px/1 "Barlow Condensed",system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#0b3a4f;background:#f2b733;border:3px solid #0b3a4f;border-radius:4px;padding:15px 20px;touch-action:none}' +

        var dx = clamp((e.clientX - touch.ox) / 46, -1, 1), dy = clamp((e.clientY - touch.oy) / 46, -1, 1);
        touch.moveX = dx; touch.moveZ = -dy;
        nub.style.transform = 'translate(' + (dx * 34) + 'px,' + (-touch.moveZ * 34) + 'px)';
      });
      function endStick(e) {
        if (e.pointerId !== touch.moveId) return;
        touch.moveId = -1; touch.moveX = touch.moveZ = 0; nub.style.transform = '';
      }
      stick.addEventListener('pointerup', endStick);
      stick.addEventListener('pointercancel', endStick);
      // right half of the screen drags the camera
      canvas.addEventListener('touchmove', function (e) {
        var t0 = e.touches[0];
        if (!t0 || t0.clientX < window.innerWidth * 0.42) return;
        if (touch.lookId === -1) { touch.lookId = t0.identifier; lastPX = t0.clientX; lastPY = t0.clientY; return; }
        cam.yaw -= (t0.clientX - lastPX) * 0.007;
        cam.pitch = clamp(cam.pitch + (t0.clientY - lastPY) * 0.005, 0.07, 1.22);
        lastPX = t0.clientX; lastPY = t0.clientY;
      }, { passive: true });
      canvas.addEventListener('touchend', function () { touch.lookId = -1; }, { passive: true });
      var lay = wrap.querySelector('#tlay'), dig = wrap.querySelector('#tdig');
      lay.addEventListener('pointerdown', function () { sfx.unlock(); placing = true; });
      lay.addEventListener('pointerup', function () { placing = false; });
      dig.addEventListener('pointerdown', function () { keys.KeyE = true; });
      dig.addEventListener('pointerup', function () { keys.KeyE = false; });

      jmp.addEventListener('pointerdown', function () { keys.Space = true; });
      jmp.addEventListener('pointerup', function () { keys.Space = false; });

    // ------------------------------------------------------------- economy
    // ----------------------------------------------------------- placement
    var lastPlace = 0;
    function cellValidity(i, j, tierIdx, checkReach) {
      if (i < -64 || i > 64 || j < 0 || j > 400) return 'out of the works';
      if (sim.get(i, j)) return 'already tiled';
      if (!sim.isSupported(i, j)) return 'nothing to rest it on';
      if (S.mortar < TIERS[tierIdx].mortar) return 'no mouna left';
      if (checkReach) {
        var dx = cellCentreX(i) - body.pos.x, dz = cellCentreZ(j) - body.pos.z;
        if (dx * dx + dz * dz > REACH * REACH) return 'too far — walk out';
      }
      return null;
    }

    function tryPlace(immediate) {
      if (!S.started) return;
      var now = S.elapsed;
      if (!immediate && now - lastPlace < 0.115) return;   // ~8 balatat a second, max
      raycaster.setFromCamera(aimNDC(), camera);
      if (!raycaster.ray.intersectPlane(groundPlane, hitPoint)) return;
      worldToCell(hitPoint.x, hitPoint.z, cellTmp);
      var bad = cellValidity(cellTmp.i, cellTmp.j, 0, true);
      if (bad) {
        if (immediate) { hud.toast(bad, 'bad'); sfx.ui(); }
        return;
      }
      if (!sim.place(cellTmp.i, cellTmp.j, 0, now)) return;
      lastPlace = now;
      S.mortar -= TIERS[0].mortar;
      S.laid++;
      tiles.add(cellTmp.i, cellTmp.j, 0);
      sfx.clack();
      fx.burst(cellCentreX(cellTmp.i), TILE_TOP, cellCentreZ(cellTmp.j), 0.55);
      mason.state.lay = 1;
      pushStats();
      if (S.laid === 1) {
        hud.toast('First balata. The sea has been warned.', 'good');
        npcEvent('firstTile');
      }
      if (S.laid === 25 || S.laid === 100 || S.laid === 250 || S.laid === 600) {
        npcEvent('milestone');
      }
    }

    // ---------------------------------------------------------- gathering
    var digTimer = 0;
    function nearestPile() {
      var best = null, bd = 9;
      var piles = world.sandPiles || [];
      for (var n = 0; n < piles.length; n++) {
        var p = piles[n];
        var dx = p.x - body.pos.x, dz = p.z - body.pos.z, dy = (p.y || DECK_Y) - body.pos.y;
        var d = Math.sqrt(dx * dx + dz * dz);
        if (d < 3.2 && Math.abs(dy) < 2.2 && d < bd) { bd = d; best = p; }
      }
      return best;
    }
    function updateGathering(dt) {
      var pile = nearestPile();
      var who = nearestNPC();
      // whoever is closer wins the E key
      if (who && (!pile || who.dist < 2.6)) {
        hud.setPrompt('E — talk to ' + who.npc.def.name);
      } else if (pile && keys.KeyE) {
        if (S.mortar >= S.mortarMax) {
          hud.setPrompt('barrow full — go tile the sea');
        } else {
          S.mortar = Math.min(S.mortarMax, S.mortar + dt * 7.5);
          digTimer -= dt;
          if (digTimer <= 0) {
            digTimer = 0.34;
            sfx.pour();
            fx.burst(pile.x + (Math.random() - 0.5), (pile.y || DECK_Y) + 0.5, pile.z + (Math.random() - 0.5), 0.3);
          }
          hud.setPrompt('shovelling mouna…');
          pushStats();
        }
      } else if (pile) {
        hud.setPrompt('hold E — shovel mouna');
      } else if (S.mortar < 1) {
        hud.setPrompt('out of mouna — back to the piles on the corniche');
      } else {
        hud.setPrompt(null);
      }
    }

    function angleTo(a, b, k) {
      var d = ((b - a + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
      return a + d * k;
    }

    var npcs = NPC_DEFS.map(function (def) {
      var rig = createMason(def.shirt, def.hatCol, def.hat);
      rig.group.scale.setScalar(def.scale || 1);
      scene.add(rig.group);
      var at = def.at(world) || { x: 0, y: DECK_Y, z: -8 };
      var npc = {
        def: def, rig: rig, pos: new THREE.Vector3(at.x, at.y == null ? DECK_Y : at.y, at.z),
        yaw: def.yaw || 0, cool: 4 + Math.random() * 10, greeted: false,
        phase: Math.random() * 6, talkIdx: 0, facing: 0
      };
      rig.group.position.copy(npc.pos);
      rig.group.rotation.y = npc.yaw;
      return npc;
    });

    function npcSay(npc, kind) {
      var pool = npc.def.lines[kind];
      if (!pool || !pool.length) return false;
      var line = pick(pool);
      var text = typeof line === 'string' ? line : line.t;
      var ar = typeof line === 'string' ? null : line.ar;
      text = String(text)
        .replace('{n}', sim.count)
        .replace('{m}', sim.count * 4);
      hud.say(npc.def.id, { name: npc.def.name, text: text, ar: ar });
      sfx.say(npc.def.voice);
      npc.cool = 14 + Math.random() * 14;
      return true;
    }

    /* Give a line to whoever is closest, has something to say about it, and is
       not already talking. If nobody is in earshot the uncle heckles from the
       HUD instead, so an event is never silently swallowed. */
    function npcEvent(kind, fallbackToHeckle) {
      if (!S.started) return false;
      var best = null, bestD = 1e9;
      for (var i = 0; i < npcs.length; i++) {
        var npc = npcs[i];
        if (!npc.def.lines[kind] || !npc.def.lines[kind].length) continue;
        if (hud.isSaying && hud.isSaying(npc.def.id)) continue;
        var dx = npc.pos.x - body.pos.x, dz = npc.pos.z - body.pos.z;
        var d = dx * dx + dz * dz;
        if (d < 2600 && d < bestD) { bestD = d; best = npc; }
      }
      if (best) return npcSay(best, kind);
      if (fallbackToHeckle) heckle();
      return false;
    }

    function nearestNPC() {
      var best = null, bd = 4.0;
      for (var i = 0; i < npcs.length; i++) {
        var n = npcs[i];
        var dx = n.pos.x - body.pos.x, dz = n.pos.z - body.pos.z;
        var dy = n.pos.y - body.pos.y;
        var d = Math.sqrt(dx * dx + dz * dz);
        if (d < 4.0 && Math.abs(dy) < 2.4 && d < bd) { bd = d; best = n; }
      }
      return best ? { npc: best, dist: bd } : null;
    }

    /* Talking walks through a character's conversation in order and wraps, so
       pressing E repeatedly is a back-and-forth rather than a slot machine.
       Im Khalil hands you mouna on the lines where she offers it. */
    function talkTo(npc) {
      var pool = npc.def.talk;
      if (!pool || !pool.length) return;
      var at = npc.talkIdx % pool.length;
      var line = pool[at];
      npc.talkIdx++;
      var text = typeof line === 'string' ? line : line.t;
      var ar = typeof line === 'string' ? null : line.ar;
      text = String(text).replace('{n}', sim.count).replace('{m}', sim.count * 4);
      hud.say(npc.def.id, { name: npc.def.name, text: text, ar: ar });
      sfx.say(npc.def.voice);
      npc.cool = 14 + Math.random() * 10;      // no idle chatter straight after
      npc.facing = 1.2;
      if (npc.def.givesAt && npc.def.givesAt.indexOf(at) >= 0) {
        var add = Math.min(6, S.mortarMax - S.mortar);
        if (add > 0.25) {
          S.mortar += add;
          hud.toast('+' + Math.round(add) + ' mouna', 'good');
          sfx.pour();
          pushStats();
        }
      }
    }

    var npcHead = new THREE.Vector3();
    function updateNPCs(dt) {
      var W = window.innerWidth, H = window.innerHeight;
      for (var i = 0; i < npcs.length; i++) {
        var npc = npcs[i], def = npc.def;
        npc.phase += dt;
        // the kid cannot stand still
        if (def.pace) {
          npc.pos.x = (def.at(world).x || 0) + Math.sin(npc.phase * 0.7) * def.pace;
          npc.rig.group.position.copy(npc.pos);
        }
        var dx = npc.pos.x - body.pos.x, dz = npc.pos.z - body.pos.z;
        var d2 = dx * dx + dz * dz;
        // turn to face you when you are close enough to talk to
        // after you talk to them they keep looking at you for a moment
        if (npc.facing > 0) npc.facing -= dt;
        var want = (d2 < 420 || npc.facing > 0)
          ? Math.atan2(body.pos.x - npc.pos.x, body.pos.z - npc.pos.z)
          : (def.yaw || 0);
        npc.yaw = angleTo(npc.yaw, want, clamp(dt * 2.4, 0, 1));
        npc.rig.group.rotation.y = npc.yaw;
        npc.rig.animate(dt, 0, false, false);

        npc.cool -= dt;
        if (S.started && d2 < 115 && npc.cool <= 0 && !(hud.isSaying && hud.isSaying(def.id))) {
          npcSay(npc, npc.greeted ? 'idle' : 'greet');
          npc.greeted = true;
        }

        // park the bubble over their head, in screen space
        npcHead.set(npc.pos.x, npc.pos.y + 2.12 * (def.scale || 1), npc.pos.z);
        npcHead.project(camera);
        var onScreen = npcHead.z < 1 && d2 < 1600 &&
          npcHead.x > -1.3 && npcHead.x < 1.3 && npcHead.y > -1.3 && npcHead.y < 1.35;
        if (hud.anchorSpeech) {
          hud.anchorSpeech(def.id, (npcHead.x * 0.5 + 0.5) * W,
            (-npcHead.y * 0.5 + 0.5) * H - 8, onScreen);
        }
      }
    }

      var phase = (k >= 0.125 && k < 0.44) ? 'day'
                : ((k < 0.125 || k < 0.66) ? 'dusk' : 'night');
      if (phase !== S.phase) {
        S.phase = phase;
        hud.setPhase(phase);
        if (phase === 'night' && S.started) {
          hud.toast('Night. The lamp on the barrow is all you get.', 'info');

        if (phase === 'dusk' && S.started) hud.toast('Maghreb. The sea goes gold.', 'info');
        if (phase === 'night' && S.started) npcEvent('night');
      }
      // the mazout generator
      var want = (phase !== 'day') ? 1.9 : 0;   // the barrow lamp, always with you
      floodlight.intensity = lerp(floodlight.intensity, want, 0.04);
      floodlight.position.set(body.pos.x, body.pos.y + 2.6, body.pos.z);

    // ---------------------------------------------------------- save / load
    function serialize() {
      return {
        v: 3, sim: sim.serialize(), mortar: S.mortar,

        px: body.pos.x, py: body.pos.y, pz: body.pos.z

    function save() {
      try { localStorage.setItem(SAVE_KEY, JSON.stringify(serialize())); } catch (e) { /* private window */ }

    function applySave(d) {
      if (!d || d.v !== 3) return false;
      try {
        if (d.sim) sim.load(d.sim);
        S.mortar = d.mortar || 0;
        S.elapsed = d.elapsed || 0; S.laid = d.laid || 0; S.lost = d.lost || 0;
        tiles.clear();
        sim.forEach(function (t) { tiles.add(t.i, t.j, t.tier); });
        body.teleport(d.px || 0, d.py || DECK_Y, d.pz || -11);

        S.nextHeckle = S.elapsed + 30;
